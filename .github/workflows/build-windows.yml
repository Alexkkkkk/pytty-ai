name: Build Windows executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win10:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build PuTTY-AI
        run: python -m PyInstaller --clean --noconfirm PuTTY-AI.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PuTTY-AI-windows
          path: dist/PuTTY-AI.exe
          if-no-files-found: error
