name: Build PuTTY-AI for Windows 7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win7:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          cache: pip
          cache-dependency-path: requirements-build-win7.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -r requirements-build-win7.txt

      - name: Build PuTTY-AI for Windows 7
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --noconsole
          --name "PuTTY-AI"
          --add-data "u_boot_errors_kb.md;."
          --add-data "learned_cases.md;."
          --add-data "skills.json;."
          --add-data "learned_rules.json;."
          --add-data "user_patches.py;."
          --icon app.ico
          --hidden-import serial
          --hidden-import serial.tools.list_ports
          --hidden-import paramiko
          putty_ai_win7.py

      - name: Upload Windows 7 executable
        uses: actions/upload-artifact@v4
        with:
          name: PuTTY-AI-windows7
          path: dist/PuTTY-AI.exe
          if-no-files-found: error
